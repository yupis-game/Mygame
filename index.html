/* 백업 코드 보호: 내용을 암호화(SHA-256 키스트림)하고 HMAC-SHA256 서명을 붙임 → 수정하면 복원 불가 */
var SHK=[0,0,0,0,0,0,0,0].map(function(_,i){return (i*2654435761+917)>>>0}).join('-')+':rapid-dot';
var K256=[],H256=[];(function(){var p=[],n=2,i,ok;while(p.length<64){ok=1;for(i=0;i<p.length;i++)if(n%p[i]===0){ok=0;break}if(ok)p.push(n);n++}
 for(i=0;i<64;i++)K256[i]=Math.floor(Math.cbrt(p[i])%1*4294967296)|0;for(i=0;i<8;i++)H256[i]=Math.floor(Math.sqrt(p[i])%1*4294967296)|0})();
function sha256(m){var l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n),W=new Array(64),h=H256.slice(),i,j,bl=l*8;
 b.set(m);b[l]=128;b[n-4]=bl>>>24;b[n-3]=bl>>>16;b[n-2]=bl>>>8;b[n-1]=bl;
 function rt(x,c){return(x>>>c)|(x<<(32-c))}
 for(i=0;i<n;i+=64){for(j=0;j<16;j++)W[j]=(b[i+4*j]<<24)|(b[i+4*j+1]<<16)|(b[i+4*j+2]<<8)|b[i+4*j+3];
  for(j=16;j<64;j++){var s0=rt(W[j-15],7)^rt(W[j-15],18)^(W[j-15]>>>3),s1=rt(W[j-2],17)^rt(W[j-2],19)^(W[j-2]>>>10);W[j]=(W[j-16]+s0+W[j-7]+s1)|0}
  var a=h[0],bb=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
  for(j=0;j<64;j++){var S1=rt(e,6)^rt(e,11)^rt(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K256[j]+W[j])|0,S0=rt(a,2)^rt(a,13)^rt(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;
   hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
  h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}
 var o=new Uint8Array(32);for(i=0;i<8;i++){o[4*i]=h[i]>>>24;o[4*i+1]=h[i]>>>16;o[4*i+2]=h[i]>>>8;o[4*i+3]=h[i]}return o}
function u8(s){return new TextEncoder().encode(s)}
function cat(a,b){var o=new Uint8Array(a.length+b.length);o.set(a);o.set(b,a.length);return o}
function hmac(k,m){var kb=k.length>64?sha256(k):k,ip=new Uint8Array(64),op=new Uint8Array(64),i,v;for(i=0;i<64;i++){v=i<kb.length?kb[i]:0;ip[i]=v^0x36;op[i]=v^0x5c}return sha256(cat(op,sha256(cat(ip,m))))}
function xorKS(d,nonce){var o=new Uint8Array(d.length),base=cat(u8(SHK),nonce),i,ks;for(i=0;i<d.length;i++){if(i%32===0)ks=sha256(cat(base,new Uint8Array([i>>5,i>>13])));o[i]=d[i]^ks[i%32]}return o}
function b64e(u){var s='',i;for(i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function b64d(t){var s=atob(t),u=new Uint8Array(s.length),i;for(i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function pack(o){var nonce=new Uint8Array(8),i;if(typeof crypto!=='undefined'&&crypto.getRandomValues)crypto.getRandomValues(nonce);else for(i=0;i<8;i++)nonce[i]=Math.random()*256;

/* 서명이 맞지 않으면(수정·위조) 예외 */
function unpack(c){c=c.replace(/\s/g,'');var q=c.indexOf(':');if(q<0||['Rapid','RAPID2'].indexOf(c.slice(0,q))<0)throw 0;var u=b64d(c.slice(q+1));if(u.length<25)throw 0;

 /* 리버브는 첫 터치 직후 잠깐 뒤에 만들어서 첫 화면 끊김을 줄임 */
 setTimeout(function(){try{var cv2=AC.createConvolver(),n=Math.floor(AC.sampleRate*2.4),bf=AC.createBuffer(2,n,AC.sampleRate),rv=AC.createGain(),sr=AC.createGain();
  for(var c=0;c<2;c++){var dd=bf.getChannelData(c);for(var j=0;j<n;j++)dd[j]=(Math.random()*2-1)*Math.pow(1-j/n,2.6)}
  cv2.buffer=bf;rv.connect(cv2);cv2.connect(mg);sr.gain.value=0.4;sg.connect(sr);sr.connect(rv)}catch(e){}},300)}catch(e){AC=null;return null}}
 if(AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function env(g,t0,d,v,a){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+d)}
function sfx(k){if(!sfxOn||!au())return;var t0=AC.currentTime,g=AC.createGain(),o;g.connect(sg);
 if(k==='ui'){o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(400,t0);o.frequency.exponentialRampToValueAtTime(180,t0+0.07);env(g,t0,0.07,0.22,0.002);o.connect(g);o.start(t0);o.stop(t0+0.12)}
 else{o=AC.createBufferSource();var f=AC.createBiquadFilter();o.buffer=nb;o.loop=true;f.type='bandpass';f.Q.value=0.6;f.frequency.setValueAtTime(2200,t0);f.frequency.exponentialRampToValueAtTime(160,t0+2);env(g,t0,2,0.2,0.24);o.connect(f);f.connect(g);o.start(t0);o.stop(t0+2.05)}}

function fit(){var bw=document.body.clientWidth,bh=document.body.clientHeight;dpr=Math.min(window.devicePixelRatio||1,2);cv.style.width=bw+'px';cv.style.height=bh+'px';cv.width=Math.round(bw*dpr);cv.height=Math.round(bh*dpr);
 ZS=Math.min(bw/W,bh/H)*ZM;VW=bw/ZS;VH=bh/ZS;offX=(VW-W)/2;offY=(VH-H)/2;
